[package]
name = "lancast"
version = "1.1.0"
edition = "2024"
description = "Send a game window and its audio as an NDI source at LAN parties"
authors = ["Kay Huber"]
license = "Apache-2.0"

# The project is "lancast"; the shipped program is "LANcast".
[[bin]]
name = "LANcast"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
ed25519-dalek = "3.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "links"] }
getrandom = "0.4.3"
grafton-ndi = { version = "2.0.0", default-features = false }
png = "0.18.1"
raw-window-handle = "0.6"
rayon = "1.12.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Windows backends. Other platforms get stubs until they have backends (D32).
[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default"] }
wasapi = "0.26.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Com"] }
windows-capture = "2.0.1"

# winit needs at least one windowing backend on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"
