[package]
name = "lancast"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
grafton-ndi = { version = "2.0.0", default-features = false }
raw-window-handle = "0.6"
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasapi = "0.26.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Console"] }
windows-capture = "2.0.1"

[dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
